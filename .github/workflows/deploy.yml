name: Deploy storefront

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Deploy to production
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ubuntu
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -e
            cd /opt/joyshop/web
            sudo git pull --ff-only origin main
            sudo docker build -t joyshop-web:latest . >/tmp/joyshop-web-build.log 2>&1
            sudo docker rm -f joyshop-web || true
            sudo docker run -d --name joyshop-web --network my_network -p 3400:3000 --restart unless-stopped joyshop-web:latest
            sleep 3
            curl -fsS http://127.0.0.1:3400/ >/dev/null
            echo "deploy ok"
